[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "Approval-gated job search and application agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools]
packages = ["jobagent"]
